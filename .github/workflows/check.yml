name: Check styles
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-style.mjs styles/*/style.json
      - run: node tools/build-index.mjs && git diff --exit-code index.json
